name: Windows Server image deployment

env:
  tag: mateuszokroj1/winserver-amd64-msvc-dev-base-image:latest

on:
  push:
    branches: [main, releases/*]

  workflow_dispatch: 

permissions:
  contents: read

jobs:
  build-test-scan-publish:

    runs-on: windows-2025
    
    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Ensure Docker Engine is running
        run: |
          $service = Get-Service -Name docker -ErrorAction Stop
          if ($service.Status -ne 'Running') {
            Start-Service -Name docker
          }

          $deadline = (Get-Date).AddSeconds(60)
          do {
            $dockerInfo = docker info 2>&1
            if ($LASTEXITCODE -eq 0) {
              Write-Host 'Docker Engine is ready.'
              exit 0
            }
            Start-Sleep -Seconds 2
          } while ((Get-Date) -lt $deadline)

          Write-Error ($dockerInfo -join [Environment]::NewLine)
          throw 'Docker Engine did not become ready within 60 seconds.'
        shell: powershell

      - name: Docker Login
        # You may pin to the exact commit or the version.
        # uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        uses: docker/login-action@v4.8.0
        with:
          # Username used to log against the Docker registry
          username: ${{ secrets.DOCKER_LOGIN }}
          # Password or personal access token used to log against the Docker registry
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build image
        run: docker build --pull --tag ${{ env.tag }} .
        shell: powershell

      - name: Verify installed toolchain and startup shell
        run: |
          $containerCommand = @'
          & C:\Enter-VsDevShell.ps1
          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) { throw 'MSVC is unavailable' }
          if ($env:VSCMD_ARG_TGT_ARCH -ne 'x64') { throw 'VS Dev Shell is not x64' }
          if (-not (Get-Command git-lfs.exe -ErrorAction SilentlyContinue)) { throw 'Git LFS is unavailable' }
          pwsh --version
          python --version
          node --version
          java --version
          cargo --version
          docker --version
          cmake --version
          dotnet --list-sdks
          nuget help
          vcpkg version
          $source = Join-Path $env:TEMP 'msvc-smoke.cpp'
          $executable = Join-Path $env:TEMP 'msvc-smoke.exe'
          [System.IO.File]::WriteAllText($source, "#include <windows.h>`r`nint main() { return GetCurrentProcessId() == 0; }")
          & cl.exe /nologo /EHsc /W4 /WX /std:c++20 $source "/Fe:$executable"
          if ($LASTEXITCODE -ne 0) { throw 'MSVC C++ smoke build failed' }
          & $executable
          if ($LASTEXITCODE -ne 0) { throw 'MSVC C++ smoke test failed' }
          '@
          $encodedCommand = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($containerCommand))
          docker run --rm --entrypoint powershell.exe ${{ env.tag }} -NoLogo -ExecutionPolicy Bypass -EncodedCommand $encodedCommand
          if ($LASTEXITCODE -ne 0) { throw 'Container toolchain verification failed' }
        shell: powershell

      - name: Publish scanned image
        run: |
          docker push ${{ env.tag }}
          if ($LASTEXITCODE -ne 0) { throw 'Docker push failed' }
        shell: powershell

      - name: Docker logout
        if: always()
        run: docker logout
        shell: powershell
