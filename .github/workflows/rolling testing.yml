name: Windows Server image CI - pull request

env:
  tag: winserver-amd64-msvc-dev-base-image:ci

on:
  pull_request:
    branches: [main, releases/*]

permissions:
  contents: read

jobs:
  build:

    environment:
      name: testing

    runs-on: windows-2025
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Docker Login
        # You may pin to the exact commit or the version.
        # uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        uses: docker/login-action@v4.8.0
        with:
          # Username used to log against the Docker registry
          username: ${{ secrets.DOCKER_LOGIN }}
          # Password or personal access token used to log against the Docker registry
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build image
        run: docker build --tag ${{ env.tag }} .
        shell: powershell

      - name: Verify installed toolchain and startup shell
        run: |
          docker run --rm --entrypoint powershell.exe ${{ env.tag }} -NoLogo -ExecutionPolicy Bypass -Command "& C:\Enter-VsDevShell.ps1; if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) { throw 'MSVC is unavailable' }; if ($env:VSCMD_ARG_TGT_ARCH -ne 'x64') { throw 'VS Dev Shell is not x64' }; if (-not (Get-Command git-lfs.exe -ErrorAction SilentlyContinue)) { throw 'Git LFS is unavailable' }; pwsh --version; python --version; node --version; java --version; cargo --version; docker --version; cmake --version; dotnet --list-sdks; nuget help; vcpkg version"
          $containerCommand = @'
          & C:\Enter-VsDevShell.ps1
          $source = Join-Path $env:TEMP 'msvc-smoke.cpp'
          $executable = Join-Path $env:TEMP 'msvc-smoke.exe'
          [System.IO.File]::WriteAllText($source, "#include <windows.h>`r`nint main() { return GetCurrentProcessId() == 0; }")
          & cl.exe /nologo /EHsc /W4 /WX /std:c++20 $source "/Fe:$executable"
          if ($LASTEXITCODE -ne 0) { throw 'MSVC C++ smoke build failed' }
          & $executable
          if ($LASTEXITCODE -ne 0) { throw 'MSVC C++ smoke test failed' }
          '@
          $containerCommand = $containerCommand -replace '\r?\n', '; '
          docker run --rm --entrypoint powershell.exe ${{ env.tag }} -NoLogo -ExecutionPolicy Bypass -Command $containerCommand
        shell: powershell
